[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-pack"
version = "0.1.0"
description = "Bind one agent-pack git repo to an app and sync skills as real md/yaml files"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
pack = "agent_pack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_pack = ["dashboard/static/*"]
